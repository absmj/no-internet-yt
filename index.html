<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İnternet yoxdur 🌿</title>
<style>
  :root {
    --ink: #535353;
    --ink-soft: #7a7a7a;
    --card: rgba(255, 255, 255, .90);
    --card-line: rgba(255, 255, 255, .65);
    --accent: #3fae4a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #2b9be8; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); user-select: none; }
  body.idle { cursor: none; }

  /* ---------- world ---------- */
  #world { position: fixed; inset: 0; overflow: hidden; }
  #bg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform-origin: 50% 70%;
    animation: drift 70s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: scale(1.0) translate3d(0, 0, 0); } to { transform: scale(1.05) translate3d(-0.8%, 0.4%, 0); } }
  #glow {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(70% 60% at 78% 4%, rgba(255, 244, 200, .9), rgba(255, 244, 200, 0) 70%);
    animation: breathe 14s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { opacity: .45; } to { opacity: .85; } }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(10, 60, 40, .28) 100%); }

  /* ---------- stage: fixed 1920×1080 canvas scaled to the window ---------- */
  #stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }

  .card {
    position: absolute; left: 480px; top: 54px; width: 960px;
    background: var(--card); border: 1px solid var(--card-line); border-radius: 18px;
    box-shadow: 0 30px 70px rgba(14, 70, 60, .28), 0 4px 14px rgba(14, 70, 60, .12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    overflow: hidden;
    animation: float 9s ease-in-out infinite alternate;
  }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-8px); } }
  .bar { display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 18px; background: rgba(240, 242, 244, .9); border-bottom: 1px solid rgba(0, 0, 0, .06); }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; background: #d0d3d6; display: block; }
  .tab { display: flex; align-items: center; gap: 9px; padding: 7px 16px; border-radius: 10px 10px 0 0; background: #fff; font-size: 15px; color: #444; margin-top: 10px; height: 36px; }
  .tab svg { width: 16px; height: 16px; }
  .url { flex: 1; height: 28px; border-radius: 14px; background: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #8a8a8a; letter-spacing: .2px; }
  .page { padding: 26px 44px 22px; }
  .head { display: flex; align-items: center; gap: 22px; }
  #icon { width: 66px; height: 66px; image-rendering: pixelated; flex: none; }
  h1 { font-size: 38px; font-weight: 600; color: #3b3b3b; letter-spacing: -.3px; }
  .sub { margin-top: 6px; font-size: 17px; line-height: 1.5; color: var(--ink-soft); }
  .sub b { font-weight: 500; color: #666; }
  .err { margin-top: 4px; font-size: 13px; letter-spacing: .6px; color: #9a9a9a; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #dino { display: block; width: 100%; height: auto; margin-top: 10px; image-rendering: pixelated; }

  /* ---------- sleeper ---------- */
  #shadow {
    position: absolute; left: 648px; top: 936px; width: 640px; height: 70px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(10, 80, 40, .42), rgba(10, 80, 40, .18) 60%, transparent);
    filter: blur(6px); animation: shadow 6.4s ease-in-out infinite;
  }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(1.03); opacity: 1; } }
  #kid { position: absolute; left: 600px; top: 600px; width: 720px; height: 410px; transform-origin: 50% 100%; animation: breath 6.4s ease-in-out infinite; }
  @keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.004, 1.012); } }

  /* ---------- fx (pollen + grass in front) ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- start gate + HUD ---------- */
  #gate {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
    background: rgba(20, 90, 70, .25); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .8s ease, visibility .8s;
  }
  #gate.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate button {
    font: inherit; font-size: 22px; font-weight: 600; letter-spacing: .3px; color: #1f5f34; cursor: pointer;
    padding: 20px 44px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, .95);
    box-shadow: 0 16px 40px rgba(10, 70, 50, .3); transition: transform .2s ease;
  }
  #gate button:hover { transform: scale(1.04); }
  #gate small { display: block; margin-top: 14px; text-align: center; color: #eaffef; font-size: 15px; text-shadow: 0 1px 8px rgba(0, 60, 40, .5); }

  #hud {
    position: fixed; right: 18px; bottom: 16px; z-index: 10; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-radius: 14px; background: rgba(255, 255, 255, .82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 13px; color: #44624b; box-shadow: 0 8px 24px rgba(10, 70, 50, .2);
    transition: opacity .6s ease; opacity: 0;
  }
  body.hud #hud { opacity: 1; }
  #hud label { display: flex; align-items: center; gap: 8px; }
  #hud input[type=range] { width: 96px; accent-color: var(--accent); }
  #hud button { font: inherit; border: 0; border-radius: 8px; padding: 6px 10px; background: #e5f3e8; color: #2d6a3c; cursor: pointer; }
  #hud button:hover { background: #d3ebd9; }
  @media (prefers-reduced-motion: reduce) { #bg, #glow, .card, #kid, #shadow { animation: none; } }
</style>
</head>
<body class="idle">

<div id="world">
  <img id="bg" src="assets/bg.png" alt="">
  <div id="glow"></div>
  <div id="vignette"></div>
</div>

<div id="stage">
  <div class="card">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#d4d6d9"/><path d="M5 10.5c1-1.4 5-1.4 6 0M5.6 6.2h.01M10.4 6.2h.01" stroke="#6b6e73" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        İnternet yoxdur
      </div>
      <div class="url">dino://offline</div>
    </div>
    <div class="page">
      <div class="head">
        <canvas id="icon" width="44" height="44"></canvas>
        <div>
          <h1>İnternet yoxdur</h1>
          <div class="sub">Bunu sınayın: <b>şəbəkə kabellərini, modemi və routeri yoxlayın</b> — və ya sadəcə bir az dincəlin.</div>
          <div class="err">ERR_INTERNET_DISCONNECTED</div>
        </div>
      </div>
      <canvas id="dino"></canvas>
    </div>
  </div>

  <div id="shadow"></div>
  <canvas id="kid" width="1440" height="820"></canvas>
</div>

<canvas id="fx"></canvas>

<div id="gate">
  <div>
    <button id="go" type="button">🌿&nbsp; Başla</button>
    <small>Səsi aktiv etmək üçün bir dəfə klikləyin</small>
  </div>
</div>

<div id="hud">
  <label>🎵 musiqi <input id="vMusic" type="range" min="0" max="100" value="35"></label>
  <label>💤 xoruldama <input id="vSnore" type="range" min="0" max="100" value="70"></label>
  <button id="fs" type="button">Tam ekran</button>
</div>

<script src="dino.js"></script>
<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var num = function (k, d) { var v = parseFloat(Q.get(k)); return isNaN(v) ? d : v; };
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- stage scaling (1920×1080 → window) ---------- */
  var stage = $('stage');
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
  }
  addEventListener('resize', fit); fit();

  /* ---------- dino game ---------- */
  var icon = $('icon'), ictx = icon.getContext('2d');
  DinoGame.drawDino(ictx, 0, 0, 2, '#6b6b6b', 'stand', false);
  var dc = $('dino');
  var game = new DinoGame(dc, { mistakeRate: num('mistakes', 0.006), auto: Q.get('manual') !== '1' });
  game.start();

  /* ---------- sleeper (sprite 4×4, 16 frames) ---------- */
  var kid = $('kid'), kctx = kid.getContext('2d');
  var sprite = new Image(); sprite.src = 'assets/sprite.png';
  var FW = 0, FH = 0, lastFrame = -1;
  // snor.mp3 loops every 18.625 s: a snore every 3.2 s (inhale ≈0.7 s, loud ≈1.0–2.0 s).
  var CYCLE = 3.2;
  var SCHEDULE = [
    [0.00, 0], [0.30, 1], [0.40, 2], [0.50, 3],                 // calm
    [0.60, 4], [0.70, 5], [0.80, 6], [0.90, 7], [1.00, 8],      // belly rises (inhale)
    [1.10, 9], [1.30, 10], [1.55, 11], [1.80, 12],              // mouth open + Z z z (snore)
    [2.00, 13], [2.20, 14], [2.40, 15], [2.60, 0]               // fading out
  ];
  function frameAt(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE, f = 0;
    for (var i = 0; i < SCHEDULE.length; i++) { if (p >= SCHEDULE[i][0]) f = SCHEDULE[i][1]; else break; }
    return f;
  }
  function drawKid(f) {
    if (!FW || f === lastFrame) return;
    lastFrame = f;
    kctx.clearRect(0, 0, kid.width, kid.height);
    kctx.imageSmoothingQuality = 'high';
    kctx.drawImage(sprite, (f % 4) * FW, Math.floor(f / 4) * FH, FW, FH, 0, 0, kid.width, kid.height);
  }
  sprite.onload = function () {
    FW = sprite.naturalWidth / 4; FH = sprite.naturalHeight / 4;
    kid.height = Math.round(kid.width * FH / FW);   // keep the sprite's proportions
    drawKid(0);
  };

  /* ---------- audio ---------- */
  var snore = new Audio('assets/snor.mp3');
  snore.loop = true; snore.preload = 'auto';
  var XF = 2.0; // seconds of cross-fade for the seamless ambience loop
  var amb = [new Audio('assets/meadow-boost.mp3'), new Audio('assets/meadow-boost.mp3')];
  amb.forEach(function (a) { a.preload = 'auto'; a.volume = 0; });
  var vMusic = num('music', 0.35), vSnore = num('snore', 0.7);
  var audioOn = false, cur = 0;
  $('vMusic').value = vMusic * 100; $('vSnore').value = vSnore * 100;
  $('vMusic').oninput = function () { vMusic = this.value / 100; };
  $('vSnore').oninput = function () { vSnore = this.value / 100; };

  function startAudio() {
    var p1 = snore.play();
    var p2 = amb[0].play();
    cur = 0;
    var ok = function () { audioOn = true; $('gate').classList.add('hide'); };
    return Promise.all([p1, p2]).then(ok);
  }
  // try silently first (works in OBS browser sources / when the browser allows autoplay)
  startAudio().catch(function () { snore.pause(); amb[0].pause(); });
  $('go').onclick = function () { startAudio().catch(function () { $('gate').classList.add('hide'); }); };

  function ambienceTick() {
    var a = amb[cur], b = amb[1 - cur];
    if (!a.paused && a.duration) {
      var left = a.duration - a.currentTime;
      var fadeIn = Math.min(1, a.currentTime / XF);
      var fadeOut = Math.min(1, left / XF);
      if (left < XF && b.paused) { b.currentTime = 0; b.volume = 0; b.play().catch(function () {}); }
      a.volume = Math.max(0, Math.min(1, vMusic * Math.min(fadeIn, fadeOut)));
      if (!b.paused) {
        var bIn = Math.min(1, b.currentTime / XF);
        b.volume = Math.max(0, Math.min(1, vMusic * bIn));
      }
      if (left <= 0.05) { a.pause(); cur = 1 - cur; }
    } else if (!b.paused) { cur = 1 - cur; }
    snore.volume = Math.max(0, Math.min(1, vSnore));
  }

  /* ---------- main loop: animation clock follows the audio clock ---------- */
  var t0 = performance.now();
  function tick(now) {
    requestAnimationFrame(tick);
    var t = (audioOn && !snore.paused) ? snore.currentTime : ((now - t0) / 1000) % 18.625;
    drawKid(frameAt(t));
    if (audioOn) ambienceTick();
  }
  requestAnimationFrame(tick);

  /* ---------- fx: pollen + swaying grass in front ---------- */
  var fx = $('fx'), c = fx.getContext('2d'), DPR = Math.min(2, devicePixelRatio || 1);
  var vw = 0, vh = 0, blades = [], motes = [];
  var GREENS = ['#2fb84a', '#3cc546', '#52d44a', '#6fe04c', '#8de85a', '#27a845'];
  function resize() {
    vw = innerWidth; vh = innerHeight;
    fx.width = vw * DPR; fx.height = vh * DPR; c.setTransform(DPR, 0, 0, DPR, 0, 0);
    blades = [];
    var n = Math.round(vw / 6);
    for (var i = 0; i < n; i++) {
      blades.push({ x: Math.random() * vw, h: (0.025 + Math.random() * 0.075) * vh, w: 2 + Math.random() * 3.5,
        ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 0.8, col: GREENS[(Math.random() * GREENS.length) | 0], lean: (Math.random() - 0.5) * 8 });
    }
    blades.sort(function (a, b) { return a.h - b.h; });
    motes = [];
    for (var j = 0; j < 46; j++) motes.push(mote(true));
  }
  function mote(init) {
    return { x: init ? Math.random() * vw : -20, y: Math.random() * vh * 0.9, r: 1 + Math.random() * 2.6, vx: 8 + Math.random() * 16,
      vy: -(2 + Math.random() * 6), ph: Math.random() * 6.28, a: 0.25 + Math.random() * 0.5 };
  }
  addEventListener('resize', resize); resize();

  var last = performance.now();
  (function fxLoop(now) {
    requestAnimationFrame(fxLoop);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var T = now / 1000;
    c.clearRect(0, 0, vw, vh);

    // pollen / dandelion seeds
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.x += (m.vx + Math.sin(T * 0.7 + m.ph) * 10) * dt;
      m.y += (m.vy + Math.cos(T * 0.9 + m.ph) * 6) * dt;
      if (m.x > vw + 20 || m.y < -20 || m.y > vh + 20) motes[i] = mote(false);
      var tw = 0.6 + 0.4 * Math.sin(T * 1.6 + m.ph);
      c.beginPath(); c.fillStyle = 'rgba(255,255,240,' + (m.a * tw).toFixed(3) + ')';
      c.arc(m.x, m.y, m.r, 0, 6.283); c.fill();
    }

    // grass blades along the bottom edge (in front of the sleeper)
    var wind = Math.sin(T * 0.5) * 0.5 + Math.sin(T * 1.3 + 1.7) * 0.3;
    for (var k = 0; k < blades.length; k++) {
      var b = blades[k];
      var sway = (wind * 10 + Math.sin(T * b.sp + b.ph) * 4 + b.lean) * (b.h / (vh * 0.1));
      var bx = b.x, by = vh + 4, tx = bx + sway, ty = by - b.h;
      c.beginPath();
      c.moveTo(bx - b.w, by);
      c.quadraticCurveTo(bx - b.w * 0.3 + sway * 0.2, by - b.h * 0.6, tx, ty);
      c.quadraticCurveTo(bx + b.w * 0.3 + sway * 0.2, by - b.h * 0.6, bx + b.w, by);
      c.closePath();
      c.fillStyle = b.col; c.fill();
    }
  })(last);

  /* ---------- HUD: appears on mouse move, hides when idle (clean capture) ---------- */
  var idleT = 0;
  function wake() {
    document.body.classList.add('hud'); document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.remove('hud'); document.body.classList.add('idle'); }, 2800);
  }
  addEventListener('mousemove', wake);
  $('fs').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () {});
  };
  addEventListener('keydown', function (e) {
    if (e.key === 'f' || e.key === 'F') $('fs').click();
    if (e.key === 'm' || e.key === 'M') { vMusic = vMusic ? 0 : num('music', 0.35); $('vMusic').value = vMusic * 100; }
    if (e.key === 's' || e.key === 'S') { vSnore = vSnore ? 0 : num('snore', 0.7); $('vSnore').value = vSnore * 100; }
  });
})();
</script>
</body>
</html>
